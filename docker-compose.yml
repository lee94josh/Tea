# Local Postgres with pgvector for development.
# Usage: docker compose up -d  → DATABASE_URL=postgresql://lookback:lookback@localhost:5432/lookback
services:
  db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: lookback
      POSTGRES_PASSWORD: lookback
      POSTGRES_DB: lookback
    ports:
      - '5432:5432'
    volumes:
      - lookback_pgdata:/var/lib/postgresql/data

volumes:
  lookback_pgdata:
